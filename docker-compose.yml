services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.htpasswd:/etc/nginx/.htpasswd
      - pma_shared_files:/var/www/html/
    networks:
      - rede_proxy
      - rede_app
    depends_on:
      - php
      - api
      - phpmyadmin

  php:
    build:
      context: ./php
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 32M
    volumes:
      - ./php/src:/var/www/html/src
    environment:
      # APP_ENV: development
      API_BASE_URL: ${API_BASE_URL}
      IP_VM: ${IP_VM}
    networks:
      - rede_app

  api:
    build:
      context: ./fastapi
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # ports:
    #   - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rede_app
      - rede_db
      - rede_metrics

  phpmyadmin:
    image: phpmyadmin:fpm-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    volumes:
      - pma_shared_files:/var/www/html/
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rede_app
      - rede_db

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.50'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${DB_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede_db
  
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    networks:
      - rede_app

  grafana:
    image: grafana/grafana:latest
    # ports:
    #   - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://${IP_VM}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - rede_proxy
      - rede_metrics
    volumes:
      - grafana-storage:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - rede_metrics

  portainer:
    image: portainer/portainer-ce:lts
    ports:
      - "8001:8000"
      - "9000:9000"
    networks:
      - rede_portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data portainer/portainer-ce:lts

volumes:
  mysql_data:
  pma_shared_files:
  grafana-storage:
  portainer_data:

networks:
  rede_proxy:
  rede_app:
    internal: true
  rede_db:
    internal: true
  rede_portainer:
  rede_metrics:
    internal: true
